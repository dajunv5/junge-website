<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>个人中心 - 有意思的书窗</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { padding-top: 0 !important; }
        .profile-page { min-height: 100vh; min-height: 100dvh; background: var(--bg-primary); padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 20px); }
        
        /* 顶部导航 */
        .profile-nav {
            position: fixed; top: 0; left: 0; right: 0; height: var(--top-bar-h); z-index: 1000;
            background: rgba(0,0,0,0.85); backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; padding: 0 16px;
        }
        .profile-nav h1 { flex: 1; font-size: 17px; font-weight: 600; color: var(--text-primary); text-align: center; }
        
        /* 用户信息 */
        .user-section {
            max-width: 960px; margin: 0 auto; padding: calc(var(--top-bar-h) + 20px) 16px 20px;
        }
        .user-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .user-avatar {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #2997ff 0%, #5e5ce6 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px; color: white;
        }
        .user-name { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
        .user-desc { font-size: 14px; color: var(--text-secondary); }
        
        /* 功能区 */
        .profile-section {
            max-width: 960px; margin: 0 auto; padding: 0 16px 20px;
        }
        .section-title {
            font-size: 13px; color: var(--text-tertiary); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 10px; padding-left: 4px;
        }
        .profile-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .profile-item {
            display: flex; align-items: center; padding: 14px 16px;
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            text-decoration: none; color: var(--text-primary);
            min-height: 44px;
        }
        .profile-item:last-child { border-bottom: none; }
        .profile-item:hover { background: rgba(255,255,255,0.03); }
        .profile-item-icon {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-size: 16px; color: white;
        }
        .profile-item-text { flex: 1; font-size: 15px; }
        .profile-item-arrow { color: var(--text-tertiary); font-size: 14px; }
        
        /* 阅读进度列表 */
        .progress-list { padding: 0; }
        .progress-item {
            display: flex; align-items: center; padding: 14px 16px;
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            text-decoration: none; color: var(--text-primary);
            min-height: 60px;
        }
        .progress-item:last-child { border-bottom: none; }
        .progress-icon {
            width: 44px; height: 44px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-size: 20px; color: white;
            background: linear-gradient(135deg, #30d158 0%, #34c759 100%);
        }
        .progress-info { flex: 1; }
        .progress-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
        .progress-bar-bg {
            width: 100%; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: var(--accent, #2997ff); border-radius: 2px;
            transition: width 0.3s ease;
        }
        .progress-pct { font-size: 13px; color: var(--text-secondary); margin-left: 12px; }
        
        /* 收藏列表 */
        .fav-item {
            display: flex; align-items: center; padding: 14px 16px;
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            text-decoration: none; color: var(--text-primary);
        }
        .fav-item:last-child { border-bottom: none; }
        .fav-cover {
            width: 44px; height: 60px; border-radius: 6px;
            background: linear-gradient(135deg, #bf5af2 0%, #ff375f 100%);
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-size: 20px; color: white;
        }
        .fav-info { flex: 1; }
        .fav-title { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
        .fav-author { font-size: 13px; color: var(--text-secondary); }
        .fav-remove {
            background: none; border: none; color: var(--text-tertiary);
            cursor: pointer; padding: 8px; font-size: 16px;
        }
        .fav-remove:hover { color: #ff453a; }
        
        /* 空状态 */
        .empty-state {
            text-align: center; padding: 40px 20px; color: var(--text-tertiary);
        }
        .empty-state i { font-size: 36px; margin-bottom: 12px; display: block; opacity: 0.3; }
        .empty-state p { font-size: 14px; }
        .empty-state a { color: var(--accent, #2997ff); text-decoration: none; }
        
        /* 设置项 */
        .setting-item {
            display: flex; align-items: center; padding: 14px 16px;
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            min-height: 44px;
        }
        .setting-item:last-child { border-bottom: none; }
        .setting-label { flex: 1; font-size: 15px; color: var(--text-primary); }
        .setting-control { display: flex; align-items: center; gap: 8px; }
        .toggle-switch {
            width: 50px; height: 30px; border-radius: 15px;
            background: rgba(255,255,255,0.2); position: relative;
            cursor: pointer; transition: background 0.3s ease;
        }
        .toggle-switch.active { background: #30d158; }
        .toggle-switch::after {
            content: ''; width: 26px; height: 26px; border-radius: 50%;
            background: white; position: absolute; top: 2px; left: 2px;
            transition: transform 0.3s ease;
        }
        .toggle-switch.active::after { transform: translateX(20px); }
        
        .btn-clear {
            background: none; border: 1px solid #ff453a; color: #ff453a;
            padding: 8px 16px; border-radius: 6px; cursor: pointer;
            font-size: 14px; width: 100%; margin-top: 10px;
        }
        .btn-clear:hover { background: rgba(255,69,58,0.1); }
    </style>
</head>
<body>
    <div class="profile-page">
        <!-- 顶部导航 -->
        <nav class="profile-nav">
            <a href="index.html" class="back-btn" style="color: var(--accent, #2997ff); text-decoration: none; font-size: 15px; min-height: 44px; display: flex; align-items: center;">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1>个人中心</h1>
            <div style="width: 44px;"></div>
        </nav>

        <!-- 用户信息 -->
        <div class="user-section">
            <div class="user-card">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-name">书友</div>
                <div class="user-desc">让阅读成为习惯</div>
            </div>
        </div>

        <!-- 阅读进度 -->
        <div class="profile-section">
            <div class="section-title">阅读进度</div>
            <div class="profile-card" id="progressCard">
                <div class="empty-state" id="progressEmpty">
                    <i class="fas fa-book-open"></i>
                    <p>暂无阅读记录</p>
                    <a href="category.html">去选书 →</a>
                </div>
            </div>
        </div>

        <!-- 我的收藏 -->
        <div class="profile-section">
            <div class="section-title">我的收藏</div>
            <div class="profile-card" id="favoritesCard">
                <div class="empty-state" id="favoritesEmpty">
                    <i class="fas fa-heart"></i>
                    <p>暂无收藏</p>
                    <a href="category.html">去发现好书 →</a>
                </div>
            </div>
        </div>

        <!-- 设置 -->
        <div class="profile-section">
            <div class="section-title">设置</div>
            <div class="profile-card">
                <div class="setting-item">
                    <span class="setting-label">夜间模式</span>
                    <div class="setting-control">
                        <div class="toggle-switch" id="nightToggle" onclick="toggleNight()"></div>
                    </div>
                </div>
                <div class="setting-item">
                    <span class="setting-label">清除阅读数据</span>
                    <button class="btn-clear" onclick="clearData()">清除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a href="category.html" class="bottom-nav-item">
            <i class="fas fa-th-large"></i>
            <span>分类</span>
        </a>
        <a href="profile.html" class="bottom-nav-item active">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <script src="books-data.js"></script>
    <script src="favorites-manager.js"></script>
    <script src="progress-manager.js"></script>
    <script>
    /* 时间自动主题 */
    (function(){
        var hour = new Date().getHours();
        if (hour >= 6 && hour < 18) document.documentElement.classList.add('day-theme');
    })();

    /* 渲染阅读进度 */
    (function() {
        var progressList = ProgressManager.getProgressList();
        var card = document.getElementById('progressCard');
        var empty = document.getElementById('progressEmpty');
        
        if (!progressList || progressList.length === 0) {
            if (empty) empty.style.display = 'block';
            return;
        }
        
        if (empty) empty.style.display = 'none';
        
        var html = '<div class="progress-list">';
        progressList.slice(0, 5).forEach(function(p) {
            var bookInfo = BOOKS_DATA.find(function(b) { return b.id === p.bookId; });
            if (bookInfo) {
                html += '<a href="' + (bookInfo.readerUrl || '#') + '" class="progress-item">';
                html += '<div class="progress-icon"><i class="fas fa-book"></i></div>';
                html += '<div class="progress-info">';
                html += '<div class="progress-title">' + (bookInfo.titleCn || bookInfo.title) + '</div>';
                html += '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ' + p.percentage + '%;"></div></div>';
                html += '</div>';
                html += '<span class="progress-pct">' + p.percentage + '%</span>';
                html += '</a>';
            }
        });
        html += '</div>';
        card.innerHTML = html;
    })();

    /* 渲染收藏列表 */
    (function() {
        var favorites = FavoritesManager.getFavorites();
        var card = document.getElementById('favoritesCard');
        var empty = document.getElementById('favoritesEmpty');
        
        if (!favorites || favorites.length === 0) {
            if (empty) empty.style.display = 'block';
            return;
        }
        
        if (empty) empty.style.display = 'none';
        
        var html = '';
        favorites.forEach(function(f) {
            html += '<div class="fav-item">';
            html += '<a href="' + (f.link || '#') + '" style="display:flex; align-items:center; flex:1; text-decoration:none; color:var(--text-primary);">';
            html += '<div class="fav-cover"><i class="fas fa-book"></i></div>';
            html += '<div class="fav-info">';
            html += '<div class="fav-title">' + (f.titleCn || f.title) + '</div>';
            html += '<div class="fav-author">' + f.author + '</div>';
            html += '</div>';
            html += '</a>';
            html += '<button class="fav-remove" onclick="removeFav(\'' + f.id + '\')"><i class="fas fa-times"></i></button>';
            html += '</div>';
        });
        card.innerHTML = html;
    })();

    /* 移除收藏 */
    function removeFav(bookId) {
        FavoritesManager.removeFavorite(bookId);
        location.reload();
    }

    /* 夜间模式切换 */
    function toggleNight() {
        var toggle = document.getElementById('nightToggle');
        var isNight = toggle.classList.toggle('active');
        if (isNight) {
            document.body.classList.add('night-mode');
        } else {
            document.body.classList.remove('night-mode');
        }
        localStorage.setItem('profile-night-mode', isNight);
    }

    /* 清除数据 */
    function clearData() {
        if (confirm('确定要清除所有阅读数据和收藏吗？此操作不可恢复。')) {
            localStorage.removeItem('progress_list');
            // 清除所有 progress_* 键
            Object.keys(localStorage).forEach(function(key) {
                if (key.startsWith('progress_')) {
                    localStorage.removeItem(key);
                }
            });
            localStorage.removeItem('book-favorites');
            location.reload();
        }
    }

    /* 初始化夜间模式 */
    (function() {
        var isNight = localStorage.getItem('profile-night-mode') === 'true';
        var toggle = document.getElementById('nightToggle');
        if (isNight && toggle) {
            toggle.classList.add('active');
            document.body.classList.add('night-mode');
        }
    })();
    </script>
</body>
</html>
