<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="书籍详情 - 有意思的书窗">
    <title>书籍详情 - 有意思的书窗</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { padding-top: 0 !important; }
        .detail-page { min-height: 100vh; min-height: 100dvh; background: var(--bg-primary); padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 20px); }
        
        /* 顶部导航 */
        .detail-nav {
            position: fixed; top: 0; left: 0; right: 0; height: var(--top-bar-h); z-index: 1000;
            background: rgba(0,0,0,0.85); backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; padding: 0 16px;
        }
        .detail-nav .back-btn {
            color: var(--accent-blue); text-decoration: none; font-size: 15px;
            display: flex; align-items: center; gap: 4px; min-height: 44px;
        }
        .detail-nav h1 { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--text-primary); }
        .detail-nav .placeholder { width: 44px; }
        
        /* 书籍封面区域 */
        .book-hero {
            margin-top: var(--top-bar-h);
            padding: 30px 16px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex; gap: 20px;
            align-items: flex-start;
        }
        .book-cover {
            width: 140px; height: 190px; border-radius: 12px;
            background: linear-gradient(135deg, #2997ff 0%, #5e5ce6 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; color: white; flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .book-info { flex: 1; padding-top: 10px; }
        .book-title { font-size: 22px; font-weight: 700; color: white; margin-bottom: 8px; line-height: 1.3; }
        .book-title-cn { font-size: 16px; color: rgba(255,255,255,0.7); margin-bottom: 12px; }
        .book-author { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 16px; }
        .book-meta { display: flex; gap: 12px; flex-wrap: wrap; }
        .meta-item { font-size: 13px; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 4px; }
        .meta-item i { font-size: 12px; }
        
        /* 操作按钮 */
        .book-actions {
            padding: 20px 16px; display: flex; gap: 12px;
        }
        .btn-primary {
            flex: 1; background: var(--accent, #2997ff); color: white;
            border: none; border-radius: 10px; padding: 14px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            text-decoration: none; text-align: center; display: flex;
            align-items: center; justify-content: center; gap: 8px;
            min-height: 44px;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1); color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            padding: 14px 20px; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            min-height: 44px;
        }
        
        /* 内容简介 */
        .book-section {
            max-width: 960px; margin: 0 auto; padding: 20px 16px;
        }
        .section-title {
            font-size: 18px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 12px;
        }
        .book-desc {
            font-size: 15px; line-height: 1.8; color: var(--text-secondary);
            background: var(--bg-card); padding: 16px; border-radius: 10px;
        }
        
        /* 目录 */
        .chapter-list { background: var(--bg-card); border-radius: 12px; overflow: hidden; }
        .chapter-item {
            display: flex; align-items: center; padding: 14px 16px;
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            text-decoration: none; color: var(--text-primary);
            min-height: 44px;
        }
        .chapter-item:last-child { border-bottom: none; }
        .chapter-item:hover { background: rgba(255,255,255,0.03); }
        .chapter-num { font-size: 14px; color: var(--text-tertiary); margin-right: 12px; min-width: 40px; }
        .chapter-name { flex: 1; font-size: 15px; }
        .chapter-arrow { color: var(--text-tertiary); font-size: 14px; }
        
        /* 相关推荐 */
        .related-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .related-item {
            background: var(--bg-card); border-radius: 10px; padding: 12px;
            text-decoration: none; color: var(--text-primary);
        }
        .related-cover {
            width: 100%; height: 100px; border-radius: 8px;
            background: linear-gradient(135deg, #30d158 0%, #34c759 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; color: white; margin-bottom: 8px;
        }
        .related-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .related-author { font-size: 11px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="detail-page">
        <!-- 顶部导航 -->
        <nav class="detail-nav">
            <a href="category.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回</a>
            <h1>书籍详情</h1>
            <div class="placeholder"></div>
        </nav>

        <!-- 书籍封面区域 -->
        <div class="book-hero" id="bookHero">
            <div class="book-cover" id="bookCover">
                <i class="fas fa-book"></i>
            </div>
            <div class="book-info">
                <div class="book-title" id="bookTitle">书名</div>
                <div class="book-title-cn" id="bookTitleCn"></div>
                <div class="book-author" id="bookAuthor">作者</div>
                <div class="book-meta">
                    <span class="meta-item"><i class="fas fa-clock"></i> <span id="bookTime">0小时</span></span>
                    <span class="meta-item"><i class="fas fa-tag"></i> <span id="bookTag">公共领域</span></span>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="book-actions">
            <a href="#" class="btn-primary" id="startReadingBtn">
                <i class="fas fa-book-open"></i> 开始阅读
            </a>
            <button class="btn-secondary" id="favBtn" onclick="toggleFav()">
                <i class="far fa-heart"></i>
            </button>
        </div>

        <!-- 内容简介 -->
        <div class="book-section">
            <h2 class="section-title">内容简介</h2>
            <div class="book-desc" id="bookDesc">
                暂无简介
            </div>
        </div>

        <!-- 目录 -->
        <div class="book-section">
            <h2 class="section-title">目录</h2>
            <div class="chapter-list" id="chapterList">
                <a href="#" class="chapter-item">
                    <span class="chapter-num">1</span>
                    <span class="chapter-name">第1章</span>
                    <span class="chapter-arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
            </div>
        </div>

        <!-- 相关推荐 -->
        <div class="book-section">
            <h2 class="section-title">相关推荐</h2>
            <div class="related-list" id="relatedList">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a href="category.html" class="bottom-nav-item">
            <i class="fas fa-th-large"></i>
            <span>分类</span>
        </a>
        <a href="profile.html" class="bottom-nav-item">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <script src="books-data.js"></script>
    <script src="favorites-manager.js"></script>
    <script>
    /* 时间自动主题 */
    (function(){
        var hour = new Date().getHours();
        if (hour >= 6 && hour < 18) document.documentElement.classList.add('day-theme');
    })();

    /* 获取URL参数 */
    function getBookId() {
        var params = new URLSearchParams(location.search);
        return params.get('id');
    }

    /* 加载书籍详情 */
    (function() {
        var bookId = getBookId();
        if (!bookId || !BOOKS_DATA) return;
        
        var book = BOOKS_DATA.find(function(b) { return b.id === bookId; });
        if (!book) return;
        
        // 更新页面标题
        document.title = (book.titleCn || book.title) + ' - 有意思的书窗';
        
        // 更新书籍信息
        document.getElementById('bookTitle').textContent = book.title;
        document.getElementById('bookTitleCn').textContent = book.titleCn || '';
        document.getElementById('bookAuthor').textContent = book.author;
        document.getElementById('bookTime').textContent = book.time || '未知';
        document.getElementById('bookTag').textContent = book.tag || '经典';
        document.getElementById('bookDesc').textContent = book.description || '暂无简介';
        
        // 更新阅读按钮链接
        document.getElementById('startReadingBtn').href = book.readerUrl || '#';
        
        // 更新收藏按钮状态
        updateFavBtn(bookId);
        
        // 生成目录（示例）
        generateChapterList(book);
        
        // 生成相关推荐
        generateRelatedBooks(book);
    })();

    /* 生成目录 */
    function generateChapterList(book) {
        // 这里可以根据不同书籍生成真实目录
        // 暂时显示示例
        var list = document.getElementById('chapterList');
        list.innerHTML = '<a href="' + (book.readerUrl || '#') + '" class="chapter-item">' +
            '<span class="chapter-num">▶</span>' +
            '<span class="chapter-name">开始阅读</span>' +
            '<span class="chapter-arrow"><i class="fas fa-chevron-right"></i></span>' +
            '</a>';
    }

    /* 生成相关推荐 */
    function generateRelatedBooks(currentBook) {
        var list = document.getElementById('relatedList');
        var related = BOOKS_DATA.filter(function(b) {
            return b.id !== currentBook.id && b.category === currentBook.category;
        }).slice(0, 3);
        
        if (related.length === 0) {
            document.querySelector('.book-section:last-child').style.display = 'none';
            return;
        }
        
        var html = '';
        related.forEach(function(b) {
            html += '<a href="book-detail.html?id=' + b.id + '" class="related-item">';
            html += '<div class="related-cover"><i class="fas fa-book"></i></div>';
            html += '<div class="related-title">' + (b.titleCn || b.title) + '</div>';
            html += '<div class="related-author">' + b.author + '</div>';
            html += '</a>';
        });
        list.innerHTML = html;
    }

    /* 更新收藏按钮 */
    function updateFavBtn(bookId) {
        var btn = document.getElementById('favBtn');
        if (FavoritesManager.isFavorite(bookId)) {
            btn.innerHTML = '<i class="fas fa-heart" style="color:#ff453a;"></i>';
        } else {
            btn.innerHTML = '<i class="far fa-heart"></i>';
        }
    }

    /* 切换收藏 */
    function toggleFav() {
        var bookId = getBookId();
        var book = BOOKS_DATA.find(function(b) { return b.id === bookId; });
        if (!book) return;
        
        FavoritesManager.toggleFavorite(book);
        updateFavBtn(bookId);
    }
    </script>
</body>
</html>
