<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="shbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/>
      <stop offset="40%" style="stop-color:#1a2a10"/>
      <stop offset="100%" style="stop-color:#2c1a0a"/>
    </linearGradient>
    <linearGradient id="shgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <filter id="shglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="300" height="400" fill="url(#shbg)"/>

  <!-- 水泊 -->
  <ellipse cx="150" cy="320" rx="130" ry="40" fill="#0a2a3a" opacity="0.3"/>
  <ellipse cx="150" cy="310" rx="100" ry="25" fill="#0a3a4a" opacity="0.2"/>

  <!-- 梁山 -->
  <path d="M50 280 Q80 240 120 260 Q150 230 180 255 Q210 235 240 260 Q265 245 280 260 L280 340 Q200 320 120 330 Q60 325 30 320 L30 300 Z" fill="#1a2a10" opacity="0.5"/>
  <path d="M40 310 Q80 290 130 300 Q180 285 230 300 Q260 290 280 300 L280 360 L30 360 Z" fill="#0d1a08" opacity="0.6"/>

  <!-- 忠义堂 -->
  <rect x="110" y="240" width="80" height="30" rx="2" fill="#2a1a0a" opacity="0.5"/>
  <path d="M105 240 L150 225 L195 240" fill="#3a1a0a" opacity="0.4"/>
  <rect x="130" y="232" width="40" height="8" rx="1" fill="#4a2a0a" opacity="0.3"/>
  <text x="150" y="260" font-family="KaiTi, STKaiti, 楷体, serif" font-size="9" fill="#DAA520" text-anchor="middle" opacity="0.5">忠义堂</text>

  <!-- 替天行道大旗 -->
  <g transform="translate(150,205)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#8B6914" stroke-width="2.5"/>
    <rect x="-20" y="0" width="40" height="30" fill="#8B0000" opacity="0.8" rx="1"/>
    <text x="0" y="12" font-family="KaiTi, STKaiti, 楷体, serif" font-size="9" fill="#FFD700" text-anchor="middle" opacity="0.9">替天</text>
    <text x="0" y="24" font-family="KaiTi, STKaiti, 楷体, serif" font-size="9" fill="#FFD700" text-anchor="middle" opacity="0.9">行道</text>
  </g>

  <!-- 好汉剪影群 -->
  <!-- 武松打虎 -->
  <g transform="translate(70,290)" opacity="0.75">
    <ellipse cx="0" cy="5" rx="7" ry="12" fill="#1a0a00"/>
    <circle cx="0" cy="-10" r="6" fill="#1a0a00"/>
    <line x1="5" y1="-4" x2="18" y2="-14" stroke="#1a0a00" stroke-width="2.5"/>
    <line x1="-3" y1="17" x2="-4" y2="28" stroke="#1a0a00" stroke-width="2.5"/>
    <line x1="3" y1="17" x2="4" y2="28" stroke="#1a0a00" stroke-width="2.5"/>
    <!-- 虎 -->
    <ellipse cx="18" cy="-4" rx="10" ry="6" fill="#3a2a0a" opacity="0.6"/>
    <circle cx="24" cy="-6" r="4" fill="#3a2a0a" opacity="0.6"/>
  </g>

  <!-- 林冲 -->
  <g transform="translate(220,285)" opacity="0.75">
    <ellipse cx="0" cy="5" rx="8" ry="14" fill="#1a0a00"/>
    <circle cx="0" cy="-12" r="7" fill="#1a0a00"/>
    <line x1="-6" y1="0" x2="-24" y2="-18" stroke="#C0C0C0" stroke-width="2"/>
    <circle cx="-24" cy="-20" r="3" fill="#C0C0C0" opacity="0.6"/>
    <line x1="-3" y1="19" x2="-4" y2="30" stroke="#1a0a00" stroke-width="2.5"/>
    <line x1="3" y1="19" x2="4" y2="30" stroke="#1a0a00" stroke-width="2.5"/>
  </g>

  <!-- 李逵双斧 -->
  <g transform="translate(140,300)" opacity="0.7">
    <ellipse cx="0" cy="5" rx="8" ry="13" fill="#1a0a00"/>
    <circle cx="0" cy="-10" r="7" fill="#1a0a00"/>
    <line x1="-6" y1="-2" x2="-18" y2="-14" stroke="#8B8B00" stroke-width="2"/>
    <line x1="6" y1="-2" x2="18" y2="-14" stroke="#8B8B00" stroke-width="2"/>
    <rect x="-22" y="-18" width="6" height="5" rx="1" fill="#8B8B00" opacity="0.6"/>
    <rect x="16" y="-18" width="6" height="5" rx="1" fill="#8B8B00" opacity="0.6"/>
    <line x1="-3" y1="18" x2="-4" y2="28" stroke="#1a0a00" stroke-width="2.5"/>
    <line x1="3" y1="18" x2="4" y2="28" stroke="#1a0a00" stroke-width="2.5"/>
  </g>

  <!-- 星空 -->
  <circle cx="40" cy="35" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="110" cy="22" r="0.7" fill="#fff" opacity="0.3"/>
  <circle cx="200" cy="30" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="260" cy="50" r="0.6" fill="#fff" opacity="0.3"/>

  <!-- ===== 书名艺术字 ===== -->
  <text x="150" y="130" font-family="KaiTi, STKaiti, 楷体, serif" font-size="58" font-weight="bold" fill="url(#shgold)" text-anchor="middle" filter="url(#shglow)" letter-spacing="10">水浒传</text>

  <text x="150" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#B8860B" text-anchor="middle" opacity="0.6" font-style="italic" letter-spacing="1">Water Margin</text>

  <line x1="60" y1="168" x2="130" y2="168" stroke="#B8860B" stroke-width="0.8" opacity="0.4"/>
  <circle cx="150" cy="168" r="2" fill="#B8860B" opacity="0.5"/>
  <line x1="170" y1="168" x2="240" y2="168" stroke="#B8860B" stroke-width="0.8" opacity="0.4"/>

  <text x="150" y="188" font-family="KaiTi, STKaiti, 楷体, serif" font-size="14" fill="#FFD700" text-anchor="middle" opacity="0.75">〔元末明初〕施耐庵 著</text>

  <rect x="0" y="375" width="300" height="25" fill="#050a00" opacity="0.4"/>
  <text x="150" y="392" font-family="KaiTi, STKaiti, 楷体, serif" font-size="10" fill="#8B6914" text-anchor="middle" opacity="0.5">中国古典四大名著 · 一百二十回</text>

  <path d="M5,5 L25,5 M5,5 L5,25" stroke="#B8860B" stroke-width="1" opacity="0.3"/>
  <path d="M295,5 L275,5 M295,5 L295,25" stroke="#B8860B" stroke-width="1" opacity="0.3"/>
  <path d="M5,395 L25,395 M5,395 L5,375" stroke="#B8860B" stroke-width="1" opacity="0.3"/>
  <path d="M295,395 L275,395 M295,395 L295,375" stroke="#B8860B" stroke-width="1" opacity="0.3"/>
</svg>
