<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="wbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a1a"/>
      <stop offset="100%" style="stop-color:#0a2a0a"/>
    </linearGradient>
    <linearGradient id="wglow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
    <filter id="wshadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="400" fill="url(#wbg)"/>

  <!-- 装饰线条 -->
  <line x1="30" y1="100" x2="270" y2="100" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
  <line x1="30" y1="300" x2="270" y2="300" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>

  <!-- 古典建筑装饰 -->
  <rect x="120" y="110" width="60" height="80" fill="none" stroke="#DAA520" stroke-width="1" opacity="0.4" rx="2"/>
  <polygon points="150,90 110,110 190,110" fill="none" stroke="#DAA520" stroke-width="1" opacity="0.4"/>

  <!-- 天平图标（象征经济平衡） -->
  <g transform="translate(150,200)" opacity="0.6">
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#FFD700" stroke-width="2"/>
    <line x1="-40" y1="30" x2="40" y2="30" stroke="#FFD700" stroke-width="2"/>
    <circle cx="-40" cy="40" r="8" fill="none" stroke="#DAA520" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="8" fill="none" stroke="#DAA520" stroke-width="1.5"/>
  </g>

  <!-- 书名 -->
  <text x="150" y="260" font-family="KaiTi, STKaiti, 楷体, serif" font-size="42" font-weight="bold" fill="url(#wglow)" text-anchor="middle" filter="url(#wshadow)" letter-spacing="6">国富论</text>

  <!-- 英文标题 -->
  <text x="150" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#DAA520" text-anchor="middle" opacity="0.6" font-style="italic" letter-spacing="1">The Wealth of Nations</text>

  <!-- 分隔线 -->
  <line x1="80" y1="298" x2="220" y2="298" stroke="#DAA520" stroke-width="0.8" opacity="0.4"/>

  <!-- 作者 -->
  <text x="150" y="318" font-family="KaiTi, STKaiti, 楷体, serif" font-size="13" fill="#FFD700" text-anchor="middle" opacity="0.75">〔英〕亚当·斯密 著</text>

  <!-- 描述 -->
  <text x="150" y="345" font-family="KaiTi, STKaiti, 楷体, serif" font-size="9" fill="#DAA520" text-anchor="middle" opacity="0.5">现代经济学奠基之作 · 1776</text>

  <!-- 底部 -->
  <rect x="0" y="375" width="300" height="25" fill="#050" opacity="0.4"/>
  <text x="150" y="392" font-family="KaiTi, STKaiti, 楷体, serif" font-size="9" fill="#8B6914" text-anchor="middle" opacity="0.5">经典经济学 · 公共领域</text>

  <!-- 角落装饰 -->
  <path d="M5,5 L20,5 M5,5 L5,20" stroke="#DAA520" stroke-width="0.8" opacity="0.3"/>
  <path d="M295,5 L280,5 M295,5 L295,20" stroke="#DAA520" stroke-width="0.8" opacity="0.3"/>
  <path d="M5,395 L20,395 M5,395 L5,380" stroke="#DAA520" stroke-width="0.8" opacity="0.3"/>
  <path d="M295,395 L280,395 M295,395 L295,380" stroke="#DAA520" stroke-width="0.8" opacity="0.3"/>
</svg>
