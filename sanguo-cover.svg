<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="sgbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#2c1810"/>
    </linearGradient>
    <linearGradient id="sggold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#DAA520"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <filter id="sgglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sgshadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="300" height="400" fill="url(#sgbg)"/>

  <!-- 战场硝烟 -->
  <ellipse cx="150" cy="280" rx="140" ry="60" fill="#8B0000" opacity="0.08"/>
  <ellipse cx="100" cy="300" rx="80" ry="40" fill="#4a0000" opacity="0.1"/>

  <!-- 远城池 -->
  <rect x="80" y="240" width="50" height="40" fill="#1a1520" opacity="0.5" rx="2"/>
  <rect x="90" y="235" width="30" height="10" fill="#1a1520" opacity="0.5" rx="1"/>
  <rect x="170" y="250" width="60" height="35" fill="#1a1520" opacity="0.4" rx="2"/>
  <rect x="185" y="244" width="30" height="10" fill="#1a1520" opacity="0.4" rx="1"/>

  <!-- 烽火 -->
  <circle cx="110" cy="232" r="4" fill="#FF4500" opacity="0.3"/>
  <circle cx="110" cy="228" r="3" fill="#FF6347" opacity="0.2"/>
  <circle cx="200" cy="240" r="5" fill="#FF4500" opacity="0.25"/>
  <circle cx="200" cy="235" r="3" fill="#FF6347" opacity="0.15"/>

  <!-- 魏旗 -->
  <g transform="translate(240,210)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#8B6914" stroke-width="2"/>
    <rect x="-18" y="0" width="36" height="28" fill="#1a3a6a" opacity="0.8" rx="1"/>
    <text x="0" y="20" font-family="KaiTi, STKaiti, 楷体, serif" font-size="18" fill="#DAA520" text-anchor="middle" opacity="0.9">魏</text>
  </g>

  <!-- 蜀旗 -->
  <g transform="translate(60,220)">
    <line x1="0" y1="0" x2="0" y2="55" stroke="#8B6914" stroke-width="2"/>
    <rect x="-18" y="0" width="36" height="28" fill="#6a1a1a" opacity="0.8" rx="1"/>
    <text x="0" y="20" font-family="KaiTi, STKaiti, 楷体, serif" font-size="18" fill="#FFD700" text-anchor="middle" opacity="0.9">蜀</text>
  </g>

  <!-- 吴旗 -->
  <g transform="translate(150,230)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#8B6914" stroke-width="2"/>
    <rect x="-18" y="0" width="36" height="28" fill="#1a4a1a" opacity="0.8" rx="1"/>
    <text x="0" y="20" font-family="KaiTi, STKaiti, 楷体, serif" font-size="18" fill="#90EE90" text-anchor="middle" opacity="0.9">吴</text>
  </g>

  <!-- 刘关张骑马剪影 -->
  <g transform="translate(120,290)" opacity="0.85">
    <!-- 刘备骑马 -->
    <g transform="translate(-40,0)">
      <ellipse cx="0" cy="8" rx="14" ry="7" fill="#2a1a0a"/>
      <ellipse cx="12" cy="2" rx="6" ry="5" fill="#2a1a0a" transform="rotate(-15,12,2)"/>
      <ellipse cx="-2" cy="-8" rx="6" ry="12" fill="#8B0000" opacity="0.7"/>
      <circle cx="-2" cy="-22" r="5" fill="#c4a882" opacity="0.6"/>
      <line x1="-10" y1="15" x2="-12" y2="26" stroke="#2a1a0a" stroke-width="2.5"/>
      <line x1="8" y1="15" x2="10" y2="26" stroke="#2a1a0a" stroke-width="2.5"/>
    </g>
    <!-- 关羽骑马 -->
    <g transform="translate(0,-5)">
      <ellipse cx="0" cy="8" rx="16" ry="8" fill="#2a1a0a"/>
      <ellipse cx="14" cy="1" rx="7" ry="6" fill="#2a1a0a" transform="rotate(-15,14,1)"/>
      <ellipse cx="-2" cy="-10" rx="7" ry="14" fill="#006400" opacity="0.6"/>
      <circle cx="-2" cy="-26" r="6" fill="#a03020" opacity="0.6"/>
      <line x1="6" y1="-16" x2="24" y2="-36" stroke="#8B8B00" stroke-width="2"/>
      <line x1="-12" y1="16" x2="-14" y2="28" stroke="#2a1a0a" stroke-width="3"/>
      <line x1="10" y1="16" x2="12" y2="28" stroke="#2a1a0a" stroke-width="3"/>
    </g>
    <!-- 张飞骑马 -->
    <g transform="translate(40,0)">
      <ellipse cx="0" cy="8" rx="14" ry="7" fill="#2a1a0a"/>
      <ellipse cx="-12" cy="2" rx="6" ry="5" fill="#2a1a0a" transform="rotate(15,-12,2)"/>
      <ellipse cx="2" cy="-8" rx="6" ry="12" fill="#1a1a2e" opacity="0.7"/>
      <circle cx="2" cy="-22" r="5" fill="#2c1810" opacity="0.7"/>
      <line x1="-8" y1="-10" x2="-26" y2="-26" stroke="#8B8B00" stroke-width="2"/>
      <line x1="-10" y1="15" x2="-8" y2="26" stroke="#2a1a0a" stroke-width="2.5"/>
      <line x1="8" y1="15" x2="6" y2="26" stroke="#2a1a0a" stroke-width="2.5"/>
    </g>
  </g>

  <!-- 星空 -->
  <circle cx="40" cy="100" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="120" cy="85" r="0.7" fill="#fff" opacity="0.3"/>
  <circle cx="200" cy="95" r="1.1" fill="#fff" opacity="0.5"/>
  <circle cx="260" cy="110" r="0.6" fill="#fff" opacity="0.3"/>

  <!-- ===== 书名艺术字（居中大字） ===== -->
  <text x="150" y="160" font-family="KaiTi, STKaiti, 楷体, serif" font-size="62" font-weight="bold" fill="url(#sggold)" text-anchor="middle" filter="url(#sgglow)" letter-spacing="12">三国演义</text>

  <!-- 英文副标题 -->
  <text x="150" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#DAA520" text-anchor="middle" opacity="0.6" font-style="italic" letter-spacing="2">Romance of the Three Kingdoms</text>

  <!-- 分隔装饰 -->
  <line x1="60" y1="198" x2="130" y2="198" stroke="#DAA520" stroke-width="0.8" opacity="0.4"/>
  <circle cx="150" cy="198" r="2" fill="#DAA520" opacity="0.5"/>
  <line x1="170" y1="198" x2="240" y2="198" stroke="#DAA520" stroke-width="0.8" opacity="0.4"/>

  <!-- 作者 -->
  <text x="150" y="218" font-family="KaiTi, STKaiti, 楷体, serif" font-size="14" fill="#FFD700" text-anchor="middle" opacity="0.75">〔元末明初〕罗贯中 著</text>

  <!-- 底部 -->
  <rect x="0" y="375" width="300" height="25" fill="#0a0500" opacity="0.4"/>
  <text x="150" y="392" font-family="KaiTi, STKaiti, 楷体, serif" font-size="10" fill="#8B6914" text-anchor="middle" opacity="0.5">中国古典四大名著 · 一百二十回</text>

  <!-- 角落装饰 -->
  <path d="M5,5 L25,5 M5,5 L5,25" stroke="#DAA520" stroke-width="1" opacity="0.3"/>
  <path d="M295,5 L275,5 M295,5 L295,25" stroke="#DAA520" stroke-width="1" opacity="0.3"/>
  <path d="M5,395 L25,395 M5,395 L5,375" stroke="#DAA520" stroke-width="1" opacity="0.3"/>
  <path d="M295,395 L275,395 M295,395 L295,375" stroke="#DAA520" stroke-width="1" opacity="0.3"/>
</svg>
