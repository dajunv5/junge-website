<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="xybg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="50%" style="stop-color:#1a0a00"/>
      <stop offset="100%" style="stop-color:#3d1500"/>
    </linearGradient>
    <linearGradient id="xygold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <radialGradient id="xyglow" cx="50%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    <filter id="xyfg">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="300" height="400" fill="url(#xybg)"/>

  <!-- 佛光 -->
  <ellipse cx="150" cy="170" rx="130" ry="100" fill="url(#xyglow)"/>

  <!-- 云海 -->
  <ellipse cx="80" cy="300" rx="60" ry="15" fill="#FFD700" opacity="0.05"/>
  <ellipse cx="220" cy="280" rx="50" ry="12" fill="#FFD700" opacity="0.04"/>
  <ellipse cx="150" cy="310" rx="80" ry="18" fill="#FFD700" opacity="0.06"/>

  <!-- 远山 -->
  <path d="M0 290 Q40 260 80 275 Q120 250 160 270 Q200 255 240 275 Q270 260 300 280 L300 400 L0 400 Z" fill="#1a0800" opacity="0.5"/>
  <path d="M0 320 Q50 300 100 310 Q150 290 200 310 Q250 295 300 305 L300 400 L0 400 Z" fill="#0d0500" opacity="0.6"/>

  <!-- 星光 -->
  <circle cx="50" cy="40" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="130" cy="25" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="210" cy="35" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="270" cy="55" r="0.7" fill="#fff" opacity="0.3"/>

  <!-- ===== 师徒四人取经剪影 ===== -->
  <g transform="translate(150,280)">
    <!-- 沙僧（最后，挑担） -->
    <g transform="translate(-75,10)">
      <ellipse cx="0" cy="6" rx="8" ry="14" fill="#1a0800"/>
      <circle cx="0" cy="-12" r="7" fill="#1a0800"/>
      <line x1="-4" y1="-6" x2="-25" y2="-18" stroke="#8B6914" stroke-width="2"/>
      <line x1="4" y1="-6" x2="25" y2="-18" stroke="#8B6914" stroke-width="2"/>
      <rect x="-30" y="-24" width="10" height="8" rx="2" fill="#2a1500" opacity="0.7"/>
      <rect x="20" y="-24" width="10" height="8" rx="2" fill="#2a1500" opacity="0.7"/>
      <line x1="-3" y1="20" x2="-4" y2="32" stroke="#1a0800" stroke-width="2.5"/>
      <line x1="3" y1="20" x2="4" y2="32" stroke="#1a0800" stroke-width="2.5"/>
    </g>

    <!-- 猪八戒 -->
    <g transform="translate(-35,5)">
      <ellipse cx="0" cy="8" rx="10" ry="16" fill="#1a0800"/>
      <circle cx="0" cy="-12" r="9" fill="#1a0800"/>
      <ellipse cx="-9" cy="-16" rx="4" ry="7" fill="#1a0800" transform="rotate(20,-9,-16)"/>
      <ellipse cx="9" cy="-16" rx="4" ry="7" fill="#1a0800" transform="rotate(-20,9,-16)"/>
      <line x1="-10" y1="0" x2="-28" y2="-16" stroke="#8B8B00" stroke-width="2"/>
      <line x1="-6" y1="24" x2="-8" y2="36" stroke="#1a0800" stroke-width="3"/>
      <line x1="6" y1="24" x2="8" y2="36" stroke="#1a0800" stroke-width="3"/>
    </g>

    <!-- 唐僧骑白马 -->
    <g transform="translate(10,0)">
      <ellipse cx="0" cy="18" rx="16" ry="9" fill="#d4c9a8" opacity="0.85"/>
      <ellipse cx="16" cy="10" rx="7" ry="5" fill="#d4c9a8" opacity="0.85" transform="rotate(-20,16,10)"/>
      <line x1="-10" y1="27" x2="-12" y2="38" stroke="#d4c9a8" stroke-width="2.5"/>
      <line x1="-3" y1="27" x2="-2" y2="38" stroke="#d4c9a8" stroke-width="2.5"/>
      <line x1="8" y1="27" x2="10" y2="38" stroke="#d4c9a8" stroke-width="2.5"/>
      <line x1="13" y1="27" x2="15" y2="38" stroke="#d4c9a8" stroke-width="2.5"/>
      <ellipse cx="-2" cy="2" rx="7" ry="12" fill="#C41E3A" opacity="0.7"/>
      <circle cx="-2" cy="-14" r="6" fill="#d4a574" opacity="0.75"/>
      <path d="M-7,-18 L-2,-25 L3,-18" fill="#FFD700" opacity="0.7"/>
      <line x1="5" y1="-2" x2="18" y2="-20" stroke="#DAA520" stroke-width="1.5"/>
      <circle cx="18" cy="-22" r="4" fill="none" stroke="#DAA520" stroke-width="1"/>
    </g>

    <!-- 孙悟空（前方，金箍棒指路） -->
    <g transform="translate(55,5)">
      <ellipse cx="0" cy="8" rx="7" ry="16" fill="#1a0800"/>
      <circle cx="0" cy="-10" r="7" fill="#1a0800"/>
      <path d="M-5,-16 L0,-24 L5,-16" fill="#DAA520" opacity="0.8"/>
      <circle cx="0" cy="-24" r="1.5" fill="#FFD700"/>
      <line x1="7" y1="-2" x2="32" y2="-28" stroke="#DAA520" stroke-width="2.5"/>
      <circle cx="32" cy="-28" r="2" fill="#FFD700"/>
      <line x1="-3" y1="24" x2="-5" y2="36" stroke="#1a0800" stroke-width="2.5"/>
      <line x1="3" y1="24" x2="5" y2="36" stroke="#1a0800" stroke-width="2.5"/>
    </g>
  </g>

  <!-- ===== 书名艺术字（居中突出） ===== -->
  <text x="150" y="130" font-family="KaiTi, STKaiti, 楷体, serif" font-size="62" font-weight="bold" fill="url(#xygold)" text-anchor="middle" filter="url(#xyfg)" letter-spacing="12">西游记</text>

  <text x="150" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#DAA520" text-anchor="middle" opacity="0.6" font-style="italic" letter-spacing="1">Journey to the West</text>

  <!-- 装饰分隔 -->
  <line x1="60" y1="168" x2="130" y2="168" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
  <circle cx="150" cy="168" r="2" fill="#FFD700" opacity="0.5"/>
  <line x1="170" y1="168" x2="240" y2="168" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>

  <!-- 作者 -->
  <text x="150" y="188" font-family="KaiTi, STKaiti, 楷体, serif" font-size="14" fill="#FFD700" text-anchor="middle" opacity="0.75">〔明〕吴承恩 著</text>

  <!-- 底部 -->
  <rect x="0" y="375" width="300" height="25" fill="#0a0500" opacity="0.4"/>
  <text x="150" y="392" font-family="KaiTi, STKaiti, 楷体, serif" font-size="10" fill="#8B6914" text-anchor="middle" opacity="0.5">中国古典四大名著 · 一百回</text>

  <path d="M5,5 L25,5 M5,5 L5,25" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  <path d="M295,5 L275,5 M295,5 L295,25" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  <path d="M5,395 L25,395 M5,395 L5,375" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  <path d="M295,395 L275,395 M295,395 L295,375" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
</svg>
