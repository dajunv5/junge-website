<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="logicbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="logicgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffb347"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <filter id="logicshadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="400" fill="url(#logicbg)"/>

  <!-- 几何装饰图案（象征逻辑结构） -->
  <g opacity="0.2">
    <rect x="50" y="80" width="200" height="2" fill="#ffd700"/>
    <rect x="50" y="120" width="200" height="2" fill="#ffd700"/>
    <rect x="50" y="160" width="200" height="2" fill="#ffd700"/>
    <rect x="50" y="200" width="200" height="2" fill="#ffd700"/>
    <rect x="50" y="240" width="200" height="2" fill="#ffd700"/>
    <rect x="50" y="280" width="200" height="2" fill="#ffd700"/>
    
    <rect x="80" y="60" width="2" height="240" fill="#ffd700"/>
    <rect x="120" y="60" width="2" height="240" fill="#ffd700"/>
    <rect x="160" y="60" width="2" height="240" fill="#ffd700"/>
    <rect x="200" y="60" width="2" height="240" fill="#ffd700"/>
    <rect x="240" y="60" width="2" height="240" fill="#ffd700"/>
  </g>

  <!-- 逻辑符号装饰 -->
  <g transform="translate(150,150)" opacity="0.6">
    <text x="0" y="0" font-family="serif" font-size="24" fill="#ffd700" text-anchor="middle">∴</text>
    <text x="-40" y="-20" font-family="serif" font-size="20" fill="#ffd700" text-anchor="middle">∧</text>
    <text x="40" y="-20" font-family="serif" font-size="20" fill="#ffd700" text-anchor="middle">∨</text>
    <text x="-40" y="20" font-family="serif" font-size="20" fill="#ffd700" text-anchor="middle">¬</text>
    <text x="40" y="20" font-family="serif" font-size="20" fill="#ffd700" text-anchor="middle">→</text>
  </g>

  <!-- 天平图标（象征逻辑推理的平衡） -->
  <g transform="translate(150,320)" opacity="0.4">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffd700" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="0" stroke="#ffd700" stroke-width="2"/>
    <circle cx="-25" cy="5" r="8" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="25" cy="5" r="8" fill="none" stroke="#ffd700" stroke-width="1.5"/>
  </g>

  <!-- 书名 -->
  <text x="150" y="100" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="url(#logicgold)" text-anchor="middle" filter="url(#logicshadow)" letter-spacing="2">A CONCISE</text>
  <text x="150" y="125" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="url(#logicgold)" text-anchor="middle" filter="url(#logicshadow)" letter-spacing="2">INTRODUCTION</text>
  <text x="150" y="150" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="url(#logicgold)" text-anchor="middle" filter="url(#logicshadow)" letter-spacing="2">TO LOGIC</text>

  <!-- 中文标题 -->
  <text x="150" y="190" font-family="KaiTi, STKaiti, serif" font-size="20" font-weight="bold" fill="#ffd700" text-anchor="middle" opacity="0.9">简明逻辑学导论</text>

  <!-- 作者 -->
  <text x="150" y="220" font-family="Georgia, serif" font-size="12" fill="#ffb347" text-anchor="middle" opacity="0.8">Patrick J. Hurley</text>

  <!-- 分隔装饰 -->
  <line x1="80" y1="235" x2="220" y2="235" stroke="#ffd700" stroke-width="0.8" opacity="0.4"/>

  <!-- 描述 -->
  <text x="150" y="255" font-family="Georgia, serif" font-size="9" fill="#ffb347" text-anchor="middle" opacity="0.6">经典逻辑学教材 · 中英对照</text>

  <!-- 底部 -->
  <rect x="0" y="375" width="300" height="25" fill="#0a0a1a" opacity="0.4"/>
  <text x="150" y="392" font-family="KaiTi, STKaiti, serif" font-size="9" fill="#ffd700" text-anchor="middle" opacity="0.5">逻辑思维 · 理性分析</text>

  <!-- 角落装饰 -->
  <path d="M5,5 L20,5 M5,5 L5,20" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  <path d="M295,5 L280,5 M295,5 L295,20" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  <path d="M5,395 L20,395 M5,395 L5,380" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  <path d="M295,395 L280,395 M295,395 L295,380" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
</svg>
