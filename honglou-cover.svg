<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="hlbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a0a1a"/>
      <stop offset="40%" style="stop-color:#3a1a2a"/>
      <stop offset="100%" style="stop-color:#1a0a10"/>
    </linearGradient>
    <linearGradient id="hlred" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C41E3A"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <linearGradient id="hlgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#D4A017"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <filter id="hlglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hlmoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff5e0;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#fff5e0;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#hlbg)"/>

  <!-- 月亮 -->
  <circle cx="230" cy="90" r="40" fill="url(#hlmoon)"/>
  <circle cx="230" cy="90" r="22" fill="#fff5e0" opacity="0.06"/>
  <circle cx="230" cy="90" r="14" fill="#fff5e0" opacity="0.04"/>

  <!-- 飘落花瓣 -->
  <ellipse cx="50" cy="180" rx="3" ry="2" fill="#C41E3A" opacity="0.3" transform="rotate(30,50,180)"/>
  <ellipse cx="130" cy="220" rx="2.5" ry="1.5" fill="#C41E3A" opacity="0.25" transform="rotate(-20,130,220)"/>
  <ellipse cx="250" cy="200" rx="3" ry="2" fill="#C41E3A" opacity="0.2" transform="rotate(45,250,200)"/>
  <ellipse cx="80" cy="280" rx="2" ry="1.5" fill="#C41E3A" opacity="0.2" transform="rotate(15,80,280)"/>
  <ellipse cx="200" cy="300" rx="2.5" ry="1.5" fill="#C41E3A" opacity="0.15" transform="rotate(-30,200,300)"/>
  <ellipse cx="170" cy="250" rx="2" ry="1.2" fill="#C41E3A" opacity="0.2" transform="rotate(60,170,250)"/>
  <ellipse cx="40" cy="320" rx="2.5" ry="1.5" fill="#C41E3A" opacity="0.15" transform="rotate(-45,40,320)"/>

  <!-- 大观园亭台 -->
  <g transform="translate(150,280)" opacity="0.6">
    <!-- 亭子 -->
    <path d="M-30,0 L0,-25 L30,0" fill="#2a1a2a" opacity="0.7"/>
    <rect x="-20" y="0" width="40" height="20" rx="1" fill="#1a0a10" opacity="0.6"/>
    <line x1="-20" y1="20" x2="-22" y2="40" stroke="#2a1a0a" stroke-width="2"/>
    <line x1="20" y1="20" x2="22" y2="40" stroke="#2a1a0a" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#2a1a0a" stroke-width="1.5"/>
    <!-- 窗格 -->
    <rect x="-12" y="4" width="8" height="8" rx="0.5" fill="none" stroke="#DAA520" stroke-width="0.5" opacity="0.4"/>
    <rect x="4" y="4" width="8" height="8" rx="0.5" fill="none" stroke="#DAA520" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- 湖水 -->
  <ellipse cx="150" cy="340" rx="120" ry="20" fill="#1a0a2a" opacity="0.3"/>
  <ellipse cx="150" cy="335" rx="90" ry="12" fill="#2a1a3a" opacity="0.2"/>

  <!-- 宝黛剪影 -->
  <g transform="translate(90,300)" opacity="0.7">
    <!-- 黛玉（左，纤细，持帕） -->
    <ellipse cx="0" cy="5" rx="5" ry="14" fill="#1a0a10"/>
    <circle cx="0" cy="-12" r="5" fill="#1a0a10"/>
    <!-- 黛玉发髻 -->
    <ellipse cx="0" cy="-18" rx="4" ry="4" fill="#1a0a10"/>
    <line x1="-3" y1="0" x2="-8" y2="8" stroke="#C41E3A" stroke-width="1.5" opacity="0.5"/>
    <line x1="-2" y1="19" x2="-3" y2="30" stroke="#1a0a10" stroke-width="2"/>
    <line x1="2" y1="19" x2="3" y2="30" stroke="#1a0a10" stroke-width="2"/>

    <!-- 宝玉（右，佩玉） -->
    <g transform="translate(25,0)">
      <ellipse cx="0" cy="5" rx="6" ry="14" fill="#1a0a10"/>
      <circle cx="0" cy="-12" r="5.5" fill="#1a0a10"/>
      <!-- 宝玉发冠 -->
      <rect x="-4" y="-20" width="8" height="4" rx="1" fill="#DAA520" opacity="0.5"/>
      <!-- 通灵宝玉 -->
      <circle cx="4" cy="0" r="3" fill="#FFD700" opacity="0.4"/>
      <line x1="-2" y1="19" x2="-3" y2="30" stroke="#1a0a10" stroke-width="2"/>
      <line x1="2" y1="19" x2="3" y2="30" stroke="#1a0a10" stroke-width="2"/>
    </g>
  </g>

  <!-- ===== 书名艺术字 ===== -->
  <text x="150" y="130" font-family="KaiTi, STKaiti, 楷体, serif" font-size="56" font-weight="bold" fill="url(#hlgold)" text-anchor="middle" filter="url(#hlglow)" letter-spacing="8">红楼梦</text>

  <text x="150" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#D4A017" text-anchor="middle" opacity="0.6" font-style="italic" letter-spacing="1">Dream of the Red Chamber</text>

  <line x1="60" y1="168" x2="130" y2="168" stroke="#D4A017" stroke-width="0.8" opacity="0.4"/>
  <circle cx="150" cy="168" r="2" fill="#D4A017" opacity="0.5"/>
  <line x1="170" y1="168" x2="240" y2="168" stroke="#D4A017" stroke-width="0.8" opacity="0.4"/>

  <text x="150" y="188" font-family="KaiTi, STKaiti, 楷体, serif" font-size="14" fill="#FFD700" text-anchor="middle" opacity="0.75">〔清〕曹雪芹 著</text>

  <rect x="0" y="375" width="300" height="25" fill="#0a0508" opacity="0.4"/>
  <text x="150" y="392" font-family="KaiTi, STKaiti, 楷体, serif" font-size="10" fill="#8B6914" text-anchor="middle" opacity="0.5">中国古典四大名著 · 一百二十回</text>

  <path d="M5,5 L25,5 M5,5 L5,25" stroke="#D4A017" stroke-width="1" opacity="0.3"/>
  <path d="M295,5 L275,5 M295,5 L295,25" stroke="#D4A017" stroke-width="1" opacity="0.3"/>
  <path d="M5,395 L25,395 M5,395 L5,375" stroke="#D4A017" stroke-width="1" opacity="0.3"/>
  <path d="M295,395 L275,395 M295,395 L295,375" stroke="#D4A017" stroke-width="1" opacity="0.3"/>
</svg>
